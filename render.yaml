envVarGroups:
  - name: synerry-shared
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: NODE_ENV
        value: production

services:
  - type: web
    name: synerry-gateway
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:web
    startCommand: npm run db:migrate -w @synerry/gateway && npm run start -w @synerry/gateway
    healthCheckPath: /health
    envVars:
      - fromGroup: synerry-shared
      - key: DATABASE_URL
        sync: false
      - key: SHORT_BASE_URL
        sync: false
      - key: ANALYTICS_URL
        sync: false

  - type: web
    name: synerry-redirect
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev
    startCommand: npm run start -w @synerry/redirect
    healthCheckPath: /health
    envVars:
      - fromGroup: synerry-shared
      - key: GATEWAY_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ANALYTICS_URL
        sync: false

  - type: web
    name: synerry-analytics
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev
    startCommand: npm run db:migrate -w @synerry/analytics && npm run start -w @synerry/analytics
    healthCheckPath: /health
    envVars:
      - fromGroup: synerry-shared
      - key: DATABASE_URL
        sync: false
      - key: IP_HASH_SALT
        generateValue: true
      - key: STATS_TIMEZONE
        value: Asia/Bangkok
